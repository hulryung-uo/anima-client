name: Release

# Push a version tag (e.g. `v0.1.0`) to build installable bundles on macOS and
# Windows and attach them to a (draft) GitHub Release. Signing is opt-in via
# repo secrets (see below / docs/DISTRIBUTION.md); without them the artifacts
# are unsigned but still usable for internal testing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the bundles

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only. A universal binary would carry an x86_64 half
          # nothing here targets, and Rosetta covers the rare Intel Mac at the
          # cost of a download twice the size for everyone else.
          - os: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          # NSIS gives the installable `…-setup.exe`. The MSI is dropped rather
          # than shipped alongside: two installers for one app is a support
          # question, and the `.exe` is the one that bootstraps WebView2.
          - os: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Installs the channel/components/targets `rust-toolchain.toml` pins.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install && rustup show active-toolchain

      - name: Add the Apple Silicon target
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      # tauri-action installs tauri-cli, runs `cargo tauri build`, and (given a
      # tagName) creates/updates the GitHub Release with the bundles attached.
      # No frontend build step: the web/ renderer is embedded in anima-net at
      # compile time and frontendDist is a static placeholder.
      # Turn on real signing + notarization ONLY when a Developer ID is actually
      # configured. This has to be a separate step that writes $GITHUB_ENV rather
      # than plain `env:` passthroughs on the build below: an unset secret arrives
      # as an EMPTY string, and tauri-action reads an empty APPLE_CERTIFICATE as
      # "present", then dies at `security import` ("parameters not valid"). So the
      # variables must be ABSENT, not empty — which a passthrough cannot express.
      # With this, adding the repo secrets is the whole switch; nothing to uncomment.
      - name: Configure Apple signing (no-op until the secrets exist)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID_: ${{ secrets.APPLE_ID }}
          APPLE_PW: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ] || [ -z "$APPLE_ID_" ] || [ -z "$APPLE_PW" ] || [ -z "$TEAM_ID" ]; then
            echo "No Developer ID configured — shipping an ad-hoc signed bundle."
            echo "Gatekeeper will refuse it; see docs/DISTRIBUTION.md."
            exit 0
          fi
          # Heredoc delimiters: the .p12 is multi-line base64.
          {
            echo "APPLE_CERTIFICATE<<__ANIMA_EOF__"; echo "$CERT"; echo "__ANIMA_EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD<<__ANIMA_EOF__"; echo "$CERT_PW"; echo "__ANIMA_EOF__"
            echo "APPLE_ID<<__ANIMA_EOF__"; echo "$APPLE_ID_"; echo "__ANIMA_EOF__"
            echo "APPLE_PASSWORD<<__ANIMA_EOF__"; echo "$APPLE_PW"; echo "__ANIMA_EOF__"
            echo "APPLE_TEAM_ID<<__ANIMA_EOF__"; echo "$TEAM_ID"; echo "__ANIMA_EOF__"
          } >> "$GITHUB_ENV"
          echo "Developer ID configured — the bundle will be signed and notarized."

      - name: Build & publish bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc sign the bundle when no Developer ID is configured. Without
          # it the .app has no Contents/_CodeSignature and `codesign --verify`
          # calls it malformed rather than merely unsigned — see
          # scripts/build-app.sh. A real identity (if the secret is ever set)
          # wins; `-` claims nothing and does not get past Gatekeeper.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          # The APPLE_* signing/notarization variables are injected by the step
          # above, and only when a real Developer ID is configured — see there
          # for why they must be absent rather than empty.
        with:
          projectPath: crates/anima-desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Anima ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
