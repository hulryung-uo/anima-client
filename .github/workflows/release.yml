name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (must match tauri.conf.json)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag and notes
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Verify tag, version, source commit and draft status
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          ANIMA_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py metadata --tag "$ANIMA_RELEASE_TAG"

  verify:
    name: Verify the release commit
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  bundle:
    name: Bundle (${{ matrix.platform }})
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            args: --target aarch64-apple-darwin --bundles app,dmg
          - os: windows-latest
            platform: windows
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - name: Add Apple Silicon target
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin
      - name: Configure Apple signing
        if: matrix.platform == 'macos'
        id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: python3 scripts/apple-signing.py
      # Upload only after both platforms finish and the final signed files
      # have been checked and hashed. The action itself creates no release.
      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: crates/anima-desktop
          args: ${{ matrix.args }}
      - name: Verify macOS application
        if: matrix.platform == 'macos'
        env:
          ANIMA_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          ANIMA_SIGNING: ${{ steps.apple.outputs.signing }}
        run: |
          set -eu
          app=target/aarch64-apple-darwin/release/bundle/macos/Anima.app
          codesign --verify --deep --strict "$app"
          if [ "$ANIMA_SIGNING" != adhoc ]; then
            codesign -dv --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'
          fi
          test "$(lipo -archs "$app/Contents/MacOS/anima-desktop")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "${ANIMA_RELEASE_TAG#v}"
      - name: Notarize and verify macOS disk image
        if: matrix.platform == 'macos' && steps.apple.outputs.signing == 'notarized'
        run: |
          set -eu
          app=target/aarch64-apple-darwin/release/bundle/macos/Anima.app
          set -- target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          test "$#" -eq 1 && test -f "$1"
          xcrun stapler validate "$app"
          spctl -a -vvv -t execute "$app"
          xcrun notarytool submit "$1" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$1"
          xcrun stapler validate "$1"
          spctl -a -vvv -t open --context context:primary-signature "$1"
      - name: Collect installer and checksum manifest
        shell: bash
        env:
          ANIMA_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          ANIMA_PLATFORM: ${{ matrix.platform }}
          ANIMA_SIGNING: ${{ steps.apple.outputs.signing || 'unsigned' }}
        run: python scripts/release.py collect --tag "$ANIMA_RELEASE_TAG" --platform "$ANIMA_PLATFORM" --signing "$ANIMA_SIGNING" --directory release-dist
      - name: Retain verified installer for draft assembly
        uses: actions/upload-artifact@v4
        with:
          name: anima-${{ needs.prepare.outputs.tag }}-${{ matrix.platform }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary notarization key
        if: always() && matrix.platform == 'macos'
        run: rm -f "$RUNNER_TEMP/anima-notary/AuthKey.p8"

  draft:
    name: Prepare draft with both verified installers
    needs: [prepare, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: anima-${{ needs.prepare.outputs.tag }}-*
          path: release-dist
          merge-multiple: true
      - name: Verify both manifests and upload to a draft only
        env:
          GH_TOKEN: ${{ github.token }}
          ANIMA_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 scripts/release.py draft --tag "$ANIMA_RELEASE_TAG" --directory release-dist

  install:
    name: Check the assembled installers
    needs: [prepare, draft]
    uses: ./.github/workflows/installer-check.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
