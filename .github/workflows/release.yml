name: Release

# Push a version tag (e.g. `v0.1.0`) to build installable bundles on macOS and
# Windows and attach them to a (draft) GitHub Release. Signing is opt-in via
# repo secrets (see below / docs/DISTRIBUTION.md); without them the artifacts
# are unsigned but still usable for internal testing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the bundles

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only. A universal binary would carry an x86_64 half
          # nothing here targets, and Rosetta covers the rare Intel Mac at the
          # cost of a download twice the size for everyone else.
          - os: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          # NSIS gives the installable `…-setup.exe`. The MSI is dropped rather
          # than shipped alongside: two installers for one app is a support
          # question, and the `.exe` is the one that bootstraps WebView2.
          - os: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Installs the channel/components/targets `rust-toolchain.toml` pins.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install && rustup show active-toolchain

      - name: Add the Apple Silicon target
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      # tauri-action installs tauri-cli, runs `cargo tauri build`, and (given a
      # tagName) creates/updates the GitHub Release with the bundles attached.
      # No frontend build step: the web/ renderer is embedded in anima-net at
      # compile time and frontendDist is a static placeholder.
      - name: Build & publish bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- macOS signing + notarization (OPT-IN) ---
          # Do NOT list the APPLE_* secrets here as plain passthroughs: when a
          # secret is unset it arrives as an EMPTY string, and Tauri treats an
          # empty APPLE_CERTIFICATE as "present" and dies at `security import`
          # ("parameters not valid"). Leaving the block out yields an unsigned
          # (adhoc) bundle, which is what we ship until a Developer ID exists.
          # To sign: add the secrets to the repo and UNCOMMENT these lines
          # (see docs/DISTRIBUTION.md).
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: crates/anima-desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Anima ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
