name: Installer checks

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release draft or public version to verify
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  fetch:
    name: Read the draft assets
    runs-on: ubuntu-latest
    # GitHub hides drafts from identities without push access. Keep this
    # permission in a download-only job; installer execution stays read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Download the actual release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ANIMA_RELEASE_TAG: ${{ inputs.tag }}
        run: gh release download "$ANIMA_RELEASE_TAG" --dir installer-input --pattern '*.dmg' --pattern '*-setup.exe' --pattern '*-build.json' --pattern SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: installer-input-${{ inputs.tag }}
          path: installer-input/*
          if-no-files-found: error
          retention-days: 2

  install:
    name: Installer files (${{ matrix.os }})
    needs: fetch
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ANIMA_RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: installer-input-${{ inputs.tag }}
          path: installer-input
      - name: Verify both installers against the tagged source and manifests
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import release
          data = release.checked_metadata(os.environ['ANIMA_RELEASE_TAG'])
          release.verify_installers(data, Path('installer-input'))
          print('Both downloaded installers match the tagged commit and SHA-256 manifests.')
          PY
      - name: Mount and copy the macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          set -- installer-input/*.dmg
          test "$#" -eq 1 && test -f "$1"
          anima_mount="$RUNNER_TEMP/anima-installer-mount"
          anima_app="$RUNNER_TEMP/anima-installer-copy/Anima.app"
          mkdir -p "$anima_mount" "$(dirname "$anima_app")"
          hdiutil verify "$1"
          hdiutil attach "$1" -readonly -nobrowse -noautoopen -mountpoint "$anima_mount"
          trap 'hdiutil detach "$anima_mount" >/dev/null' EXIT
          ditto "$anima_mount/Anima.app" "$anima_app"
          codesign --verify --deep --strict "$anima_app"
          test "$(lipo -archs "$anima_app/Contents/MacOS/anima-desktop")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$anima_app/Contents/Info.plist")" = "${ANIMA_RELEASE_TAG#v}"
          if python3 -c 'import json,sys; sys.exit(json.load(open("installer-input/macos-build.json"))["signing"] != "notarized")'; then
            xcrun stapler validate "$anima_app"
            spctl -a -vvv -t execute "$anima_app"
          fi
          echo 'DMG mount, application copy, version and signature checks passed. App UI was not launched.'
      - name: Install and uninstall on Windows without launching the app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem 'installer-input/*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Anima-install-verification'
          $appExe = Join-Path $installDir 'anima-desktop.exe'
          $uninstaller = Join-Path $installDir 'uninstall.exe'
          if (Test-Path $installDir) { throw 'The isolated installation directory already exists.' }
          try {
            # NSIS /S is silent. Omitting /R prevents launching the app.
            $process = Start-Process -FilePath $installer[0].FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer exit code: $($process.ExitCode)" }
            if (!(Test-Path $appExe) -or !(Test-Path $uninstaller)) { throw 'Installed files are incomplete.' }
            $version = $env:ANIMA_RELEASE_TAG.Substring(1)
            $installedVersion = (Get-Item $appExe).VersionInfo.ProductVersion
            if (@($version, "$version.0") -notcontains $installedVersion) { throw "Unexpected installed version: $installedVersion" }
            # Verify the installed payload, not just the installer: a console
            # subsystem opens an unwanted terminal when launched from Explorer.
            $bytes = [IO.File]::ReadAllBytes($appExe)
            if ($bytes.Length -lt 64 -or [BitConverter]::ToUInt16($bytes, 0) -ne 0x5A4D) { throw 'Invalid executable DOS header.' }
            $pe = [BitConverter]::ToInt32($bytes, 60)
            if ($pe -lt 64 -or $pe -gt $bytes.Length - 94) { throw 'Invalid executable PE offset.' }
            if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x4550) { throw 'Invalid executable PE signature.' }
            $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
            if ($subsystem -ne 2) { throw "Expected Windows GUI subsystem (2), got $subsystem." }
            Write-Output "Installed Anima $installedVersion successfully."
          } finally {
            if (Test-Path $uninstaller) {
              $process = Start-Process -FilePath $uninstaller -ArgumentList "/S _?=$installDir" -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "Uninstaller exit code: $($process.ExitCode)" }
            }
            $appRemains = Test-Path $appExe
            if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
            if ($appRemains) { throw 'The uninstaller left the application binary behind.' }
          }
          Write-Output 'Installation and uninstallation passed. App UI and gameplay were not exercised.'
