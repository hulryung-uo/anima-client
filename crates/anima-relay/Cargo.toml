[package]
name = "anima-relay"
version = "0.0.0"
edition = "2021"
description = "WebSocket↔TCP relay: lets a browser-hosted anima-core (anima-wasm) reach a UO shard, which browsers cannot do directly."
license = "MIT OR Apache-2.0"

# No dependencies, on purpose. This is a byte pump: the only non-trivial thing
# in it is RFC 6455's handshake + framing, and pulling a WebSocket stack (and
# its async runtime) in for that would be most of a dependency tree for ~200
# lines of well-specified protocol. The UO protocol itself lives in
# `anima-core`, running in the browser — this process never parses a packet.

[[bin]]
name = "anima-relay"
path = "src/main.rs"
